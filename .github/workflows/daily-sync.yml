name: daily-kb-sync

on:
  schedule:
    - cron: "0 2 * * *" # every day at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kb-sync
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  sync:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kb-sync .

      - name: Run sync (scrape -> delta -> upload)
        shell: bash
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p out
          docker run --rm -e API_KEY -v "$PWD/out:/app/data" kb-sync main.py 2>&1 | tee out/sync.log

      - name: Job summary
        if: always()
        shell: bash
        run: |
          echo '### KB sync result' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          sudo cat out/last_run.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo '{"error": "no report"}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-sync-${{ github.run_id }}
          path: |
            out/sync.log
            out/last_run.json
          retention-days: 30
